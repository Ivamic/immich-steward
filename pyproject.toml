# Workspace root. Members are listed below; the root itself is not a package.

[tool.uv.workspace]
members = ["core", "worker"]

[tool.uv.sources]
steward = { workspace = true }
steward-worker = { workspace = true }

[dependency-groups]
dev = [
    "steward",
    "steward-worker",
    "httpx2>=2.13",
    "mypy>=1.15",
    "pip-licenses>=5.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["steward", "steward_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["core/src", "worker/src"]
packages = ["steward", "steward_worker"]

# Heavy optional dependencies of the worker modules (extras), not installed for checks.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "geoclip", "geoclip.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "worker/tests"]
