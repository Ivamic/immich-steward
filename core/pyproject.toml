[project]
name = "steward"
version = "0.7.0"
description = "Core service of immich-steward: a companion app that restores missing metadata in an Immich library."
license = "AGPL-3.0-or-later"
authors = [{ name = "Ivamic" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15",
    "asyncpg>=0.30",
    "cryptography>=46",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "pgvector>=0.5.1",
    "pillow>=13",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn>=0.34",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
