# immich-steward: core service (API + web UI) and its database.
# Copy example.env (.env.example in the source) to .env, set the required values, then run:
#   docker compose up -d
# Update: docker compose pull && docker compose up -d. This file stays the same within a major
# version; the settings live in .env.
# To build the images from source instead: see compose.build.yaml.

name: immich-steward

services:
  core:
    image: ghcr.io/ivamic/immich-steward-core:${STEWARD_VERSION:-0}
    restart: unless-stopped
    ports:
      - "${STEWARD_PORT:-8780}:8080"
    env_file: .env
    environment:
      STEWARD_DATABASE_URL: "postgresql+asyncpg://${DB_USER:-steward}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-steward}"
      STEWARD_IMMICH_URL: "${STEWARD_IMMICH_URL:?set STEWARD_IMMICH_URL in .env}"
      STEWARD_SECRET_KEY: "${STEWARD_SECRET_KEY:?set STEWARD_SECRET_KEY in .env}"
    depends_on:
      db:
        condition: service_healthy

  # Runs ML location modules (GeoCLIP, similar photos) on the CPU. Optional: start it with
  #   docker compose --profile worker up -d
  # after setting STEWARD_WORKER_TOKEN in .env.
  worker:
    profiles: [worker]
    image: ghcr.io/ivamic/immich-steward-worker:${STEWARD_VERSION:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      STEWARD_CORE_URL: "http://core:8080"
      # The container's host name is random: name it after the server.
      STEWARD_WORKER_NAME: "${STEWARD_WORKER_NAME:-server}"
      # The worker needs only its token: the secrets of the core stay out of it.
      STEWARD_SECRET_KEY: ""
      STEWARD_DATABASE_URL: ""
      DB_PASSWORD: ""
    volumes:
      - model-cache:/models
    # GeoCLIP needs about 3 GB at its peak, similar photos about 1.2 GB (2 GB while loading).
    mem_limit: "${STEWARD_WORKER_MEMORY_LIMIT:-6g}"
    depends_on:
      core:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-steward}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      POSTGRES_DB: "${DB_NAME:-steward}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  model-cache:
