# SPDX-License-Identifier: AGPL-3.0-or-later

[project]
name = "steward-worker"
version = "0.6.0rc1"
description = "Worker of immich-steward: runs location modules (ML models) for the core service."
license = "AGPL-3.0-or-later"
authors = [{ name = "Ivamic" }]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13",
]

[project.optional-dependencies]
# M2 GeoCLIP. Pick one PyTorch build as well: "cpu" (servers, the Docker image) or "cuda"
# (NVIDIA GPUs), e.g. `uv sync --package steward-worker --extra geoclip --extra cpu`.
geoclip = ["geoclip>=1.2.3", "pillow>=13"]
# M3 similar photos (MegaLoc); the weights come from Hugging Face on first use.
similar = ["huggingface-hub>=0.25", "safetensors>=0.4", "pillow>=13"]
cpu = ["torch>=2.5", "torchvision>=0.20"]
cuda = ["torch>=2.5", "torchvision>=0.20"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
steward-worker = "steward_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
