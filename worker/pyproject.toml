[project]
name = "steward-worker"
version = "0.1.0"
description = "Worker of immich-steward: runs location modules (ML models) for the core service."
license = "AGPL-3.0-or-later"
authors = [{ name = "Ivamic" }]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13",
]

[project.scripts]
steward-worker = "steward_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
