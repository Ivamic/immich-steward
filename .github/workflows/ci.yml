# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steward"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STEWARD_DATABASE_URL: postgresql+asyncpg://steward:steward@localhost:5432/steward
      STEWARD_TEST_DATABASE_URL: postgresql+asyncpg://steward:steward@localhost:5432/steward
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact version tags only (no floating major tag).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrations
        run: uv run alembic -c core/alembic.ini upgrade head
      - name: Tests
        run: uv run pytest
      - name: Licenses
        # Only licenses compatible with AGPL-3.0-or-later are allowed.
        run: >-
          uv run pip-licenses --partial-match --ignore-packages steward steward-worker
          --allow-only "MIT;BSD;Apache;ISC;MPL;PSF;Python Software Foundation;HPND;LGPL;PostgreSQL"

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:licenses
      - run: pnpm build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/core.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
