# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Python)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steward"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STEWARD_DATABASE_URL: postgresql+asyncpg://steward:steward@localhost:5432/steward
      STEWARD_TEST_DATABASE_URL: postgresql+asyncpg://steward:steward@localhost:5432/steward
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact version tags only (no floating major tag).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: |
          uv run mypy
          uv run mypy core/tests core/migrations worker/tests
      - name: Migrations
        run: uv run alembic -c core/alembic.ini upgrade head
      - name: Tests
        run: uv run pytest
      - name: Licenses
        # Only licenses compatible with AGPL-3.0-or-later are allowed.
        run: >-
          uv run pip-licenses --partial-match --ignore-packages steward steward-worker
          --allow-only "MIT;BSD;Apache;ISC;MPL;PSF;Python Software Foundation;HPND;LGPL;PostgreSQL"

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:licenses
      - run: pnpm build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/core.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  worker-image:
    name: Worker image
    runs-on: ubuntu-latest
    needs: [core]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          tags: immich-steward-worker:ci
          load: true
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Licenses of the packages in the image
        # The ML dependencies (PyTorch, transformers, GeoCLIP...) are only installed in this image.
        run: >-
          docker run --rm --entrypoint sh immich-steward-worker:ci -c
          "pip install --quiet --target /tmp/pl pip-licenses &&
          PYTHONPATH=/tmp/pl python -m piplicenses --python /app/venv/bin/python --partial-match
          --ignore-packages steward-worker
          --allow-only 'MIT;BSD;Apache;ISC;MPL;PSF;Python Software Foundation;HPND;LGPL;PostgreSQL'"

  compose:
    name: Compose and update from the last release
    runs-on: ubuntu-latest
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: compose.yaml works with only the required settings
        run: |
          printf 'STEWARD_IMMICH_URL=http://127.0.0.1:9\nSTEWARD_SECRET_KEY=%s\nDB_PASSWORD=ci\n' \
            "$(openssl rand -hex 32)" > .env
          docker compose config -q
          docker compose --profile worker config -q
          # Without a required setting it stops with a clear message.
          grep -v STEWARD_IMMICH_URL .env > /tmp/partial.env
          if docker compose --env-file /tmp/partial.env config -q 2>/tmp/err; then exit 1; fi
          grep -q "set STEWARD_IMMICH_URL" /tmp/err
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/core.Dockerfile
          tags: ghcr.io/ivamic/immich-steward-core:ci
          load: true
          push: false
          cache-from: type=gha
      - name: Start the last release
        run: |
          previous=$(git tag --sort=-v:refname --no-contains HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "Last release: $previous"
          STEWARD_VERSION=${previous#v} docker compose up -d --wait core
      - name: Update to this version with the same compose.yaml and .env
        run: |
          STEWARD_VERSION=ci docker compose up -d --wait core
          docker compose exec -T core alembic -c /app/alembic.ini current | tee /tmp/current
          grep -q "(head)" /tmp/current
          curl -fsS http://127.0.0.1:8780/api/health | tee /tmp/health
          python3 -c "import json; assert json.load(open('/tmp/health'))['database']['ok']"
      - name: Logs
        if: failure()
        run: docker compose logs
