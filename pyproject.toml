# Workspace root. Members are listed below; the root itself is not a package.

[tool.uv.workspace]
members = ["core", "worker"]

[tool.uv]
# geoclip 1.2.3 caps Pillow below 13 ahead of time; it only opens images with it. Pillow 13 fixes
# security issues in the decoders, so it is used anyway (drop this once geoclip allows it).
override-dependencies = ["pillow>=13"]

[tool.uv.sources]
steward = { workspace = true }
steward-worker = { workspace = true }

[dependency-groups]
dev = [
    "steward",
    "steward-worker",
    "httpx2>=2.13",
    "mypy>=1.15",
    "pip-licenses>=5.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Third-party code kept exactly as published.
extend-exclude = ["worker/src/steward_worker/modules/megaloc_model.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["steward", "steward_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["core/src", "worker/src"]
packages = ["steward", "steward_worker"]

# Heavy optional dependencies of the worker modules (extras), not installed for checks.
[[tool.mypy.overrides]]
module = [
    "torch", "torch.*", "torchvision", "torchvision.*", "geoclip", "geoclip.*", "PIL", "PIL.*",
    "huggingface_hub", "huggingface_hub.*", "safetensors", "safetensors.*",
]
ignore_missing_imports = true

# Third-party code kept exactly as published.
[[tool.mypy.overrides]]
module = ["steward_worker.modules.megaloc_model"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "worker/tests"]
